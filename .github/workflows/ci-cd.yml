name: CI/CD - Cidades ESG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build
        run: mvn -B clean package -DskipTests
      - name: Testes automatizados
        run: mvn -B test

  docker-build:
    name: Build da imagem Docker
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t cidades-esg:${{ github.sha }} .

  deploy-staging:
    name: Deploy Staging
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://esg-staging.onrender.com
    steps:
      - name: Disparar deploy no Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail -X POST "$HOOK"
      - name: Teste de fumaca
        run: |
          sleep 60
          curl --fail --retry 20 --retry-delay 15 --retry-all-errors --max-time 30 https://esg-staging.onrender.com/actuator/health

  deploy-production:
    name: Deploy Producao
    needs: deploy-staging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://esg-production.onrender.com
    steps:
      - name: Disparar deploy no Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail -X POST "$HOOK"
      - name: Teste de fumaca
        run: |
          sleep 60
          curl --fail --retry 20 --retry-delay 15 --retry-all-errors --max-time 30 https://esg-production.onrender.com/actuator/health
