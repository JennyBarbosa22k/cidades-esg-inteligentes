name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    name: Construir e testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar
        run: dotnet restore EnergiaSustentavel.sln

      - name: Build
        run: dotnet build EnergiaSustentavel.sln --no-restore -c Release

      - name: Testes automatizados
        run: dotnet test EnergiaSustentavel.sln --no-build -c Release --verbosity normal
